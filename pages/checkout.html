<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - Bookify</title>
  <link rel="stylesheet" href="checkout.css">
</head>
<body>

  <!-- Top Header -->
  <header class="checkout-header">
    <div class="logo">Bookify</div>
    <div class="secure-badge">🔒 Secure Checkout</div>
    <a href="products.html" class="back-link">Back to Cart</a>
  </header>

  <main class="checkout-main">
    
    <!-- Left Column: Forms -->
    <div class="checkout-forms">
      
      <!-- Shipping Address Section -->
      <section class="form-section">
        <h2>Shipping Address</h2>
        <form class="address-form">
          <div class="form-row">
            <div class="form-group">
              <label>First Name *</label>
              <input type="text" placeholder="Sarah" required>
            </div>
            <div class="form-group">
              <label>Last Name *</label>
              <input type="text" placeholder="Jenkins" required>
            </div>
          </div>
          <div class="form-group">
            <label>Street Address *</label>
            <input type="text" placeholder="123 Main St" required>
          </div>
          <div class="form-row three-col">
            <div class="form-group">
              <label>City *</label>
              <input type="text" placeholder="City" required>
            </div>
            <div class="form-group">
              <label>State / Province *</label>
              <input type="text" placeholder="State" required>
            </div>
            <div class="form-group">
              <label>Postal Code *</label>
              <input type="text" placeholder="10001" required>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Email Address *</label>
              <input type="email" placeholder="sarah.jenkins@design.co" required>
            </div>
            <div class="form-group">
              <label>Phone Number *</label>
              <input type="tel" placeholder="+1 (555) 234-5678" required>
            </div>
          </div>
        </form>
      </section>

      <!-- Payment Method Section -->
      <section class="form-section">
        <h2>Payment Method</h2>
        <div class="payment-tabs">
          <button class="payment-tab active">Credit Card</button>
          <button class="payment-tab">PayPal</button>
        </div>
        <form class="payment-form">
          <div class="form-group">
            <label>Card Number *</label>
            <input type="text" placeholder="4111 •••• •••• 4242" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Expiration Date *</label>
              <input type="text" placeholder="12/26" required>
            </div>
            <div class="form-group">
              <label>Security Code (CVV) *</label>
              <input type="password" placeholder="•••" required>
            </div>
          </div>
          <div class="form-group">
            <label>Name on Card *</label>
            <input type="text" placeholder="Sarah Jenkins" required>
          </div>
        </form>
      </section>

    </div>

    <!-- Right Column: Order Summary -->
    <aside class="order-summary">
      <h2>Order Summary</h2>
      
      <!-- Dynamic Cart Items Render Here -->
      <div id="checkout_items_container" class="summary-items-list">
        <!-- JS will populate items here -->
      </div>

      <div class="promo-box">
        <input type="text" placeholder="Promo or gift code">
        <button type="button">Apply</button>
      </div>

      <div class="summary-totals">
        <div class="row">
          <span>Subtotal</span>
          <span id="checkout_subtotal">$0.00</span>
        </div>
        <div class="row">
          <span>Shipping</span>
          <span class="free">Free</span>
        </div>
        <div class="row">
          <span>Estimated Tax</span>
          <span>$2.00</span>
        </div>
        <hr>
        <div class="row total-due">
          <span>Total Due</span>
          <strong id="checkout_total_price">$0.00</strong>
        </div>
      </div>

      <button id="place_order_btn" class="place-order-btn">Place Order</button>
      
      <p class="encryption-note">🔒 Your transaction is encrypted with military-grade SSL standards.</p>
    </aside>

  </main>

  <script src="checkout.js"></script>
</body>
</html>
