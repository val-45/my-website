<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>display item</title>
    <link rel="stylesheet" href="display.css">
</head>
<!-- this is the display item page for bookify -->

  <div class="product-display">
    <div class="product-image">
      <img src="https://unsplash.com">
    </div>
    
    <div class="product-info">
      <span class="site-name">Bookify</span>
      <h1 class="product-title">Product Name</h1>
      <h2 class="product-subheading">Subheading</h2>
      <p class="product-price">$10.99</p>
      <p class="product-description">
        product description goes here.
      </p>
      <button id="add_to_cart_btn" class="btn-primary">Add to cart</button>
    </div>
  </div>

  
  <div class="related-products">
    <h2>Related products</h2>
    <div class="products-grid">
      
      <div class="product-card">
        <img src="pages/images/pyschology.jpeg">
        <h3>Product</h3>
        <p class="desc">Description of first product.</p>
        <p class="price">$10.99</p>
      </div>

      <div class="product-card">
        <img src="pages/images/algebra.webp">
        <h3>Product</h3>
        <p class="desc">Description of second product.</p>
        <p class="price">$10.99</p>
      </div>

      <!-- Product Card 3 -->
      <div class="product-card">
        <img src="pages/images/calc.jpeg" >
        <h3>Product</h3>
        <p class="desc">Description of third product.</p>
        <p class="price">$10.99</p>
      </div>

    </div>
  </div>

  <script src="display.js"></script>
</html>
